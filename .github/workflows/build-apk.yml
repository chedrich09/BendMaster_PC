name: Generate Native Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Fixed: Bumped from 17 to 21 to match Gradle requirements

      - name: Initialize Free Native App Project
        run: |
          # 1. Create a minimal required web shell directory structure
          mkdir www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover"><title>Native Shell</title></head><body></body></html>' > www/index.html
          
          # 2. Setup Capacitor packages
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Create the Capacitor native configuration mapping
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mystudio.nativeapp",
            "appName": "AI Studio App",
            "webDir": "www",
            "server": {
              "url": "https://ai.studio/apps/978fcf50-f210-4bc5-aa9b-b8e29688d949?fullscreenApplet=true",
              "cleartext": true
            }
          }
          EOF

          # 4. Bootstrap the native Android build platform structure
          npx cap add android
          npx cap sync android

      - name: Compile Standalone Native APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native APK File
        uses: actions/upload-artifact@v4
        with:
          name: native-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
