name: Generate Native Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Free Offline Native App
        run: |
          # 1. Setup Capacitor core build packages
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 2. Map Capacitor directly to your offline www folder
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mystudio.offlineapp",
            "appName": "Offline Studio App",
            "webDir": "www"
          }
          EOF

          # 3. Bootstrap the native Android build platform structure
          npx cap add android

      - name: Generate App Icon and Splash Screen
        run: |
          if [ -d "assets" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          else
            echo "Assets folder not found, skipping icon generation."
          fi

      - name: Sync Web Code and Apply Configurations
        run: |
          # Copy your custom offline assets folder straight into the Android package
          npx cap sync android

      - name: Resolve Kotlin Duplicate Class Conflicts
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                      details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                  }
              }
          }
          EOF

      - name: Compile Standalone Native APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native APK File
        uses: actions/upload-artifact@v4
        with:
          name: native-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
