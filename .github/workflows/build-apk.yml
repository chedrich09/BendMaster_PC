name: Generate Native Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Caching optimization layer to drop compilation wait times down
      - name: Setup Gradle Build Cache Interceptor
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Initialize Full-Screen Native App Project
        run: |
          # 1. Create a minimal fallback web folder required by the native compiler toolchain
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover"><title>Native Shell</title></head><body></body></html>' > www/index.html
          
          # 2. Setup Capacitor packages
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Target the official Google AI Studio production route and name the app BenderMaster
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mystudio.nativeapp",
            "appName": "BenderMaster",
            "webDir": "www",
            "server": {
              "url": "https://google.com",
              "cleartext": true,
              "allowNavigation": [
                "://google.com",
                "*.google.com",
                "*.gstatic.com",
                "*.googleapis.com",
                "://google.com"
              ]
            }
          }
          EOF

          # 4. Bootstrap the native Android build platform structure
          npx cap add android

      - name: Generate App Icon and Splash Screen
        run: |
          if [ -d "assets" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          else
            echo "Assets folder not found, skipping icon generation."
          fi

      - name: Force App Isolation (Lock Web Views Inside Container)
        run: |
          npx cap sync android
          
          # Inject full-screen WebView Client intercept rules directly into the java application layer
          TARGET_FILE="android/app/src/main/java/com/mystudio/nativeapp/MainActivity.java"
          
          cat << 'EOF' > $TARGET_FILE
          package com.mystudio.nativeapp;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  getWindow().getDecorView().post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              WebView webView = (WebView) getBridge().getWebView();
                              webView.getSettings().setJavaScriptEnabled(true);
                              webView.getSettings().setDomStorageEnabled(true);
                              
                              // Handle sub-domains and single-sign-on links seamlessly inside the app
                              webView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                                      view.loadUrl(url);
                                      return true;
                                  }
                              });
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Resolve Kotlin Duplicate Class Conflicts
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                      details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                  }
              }
          }
          EOF

      - name: Compile Standalone Native APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --build-cache

      - name: Upload Native APK File
        uses: actions/upload-artifact@v4
        with:
          name: native-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
